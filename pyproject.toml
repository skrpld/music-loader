[project]
name = "music-loader"
version = "2.0.0"
description = "Downloads music with metadata from Spotify and SoundCloud, fetches verified lyrics, and prepares the library for Symfonium."
requires-python = ">=3.10"
dependencies = [
    "spotdl>=4.2.0",
    # curl-cffi: SoundCloud answers profile/likes/reposts listings with HTTP
    # 403 unless yt-dlp can impersonate a browser.
    "yt-dlp[default,curl-cffi]>=2026.2.21",
    "rich>=13.7.0",
    "mutagen>=1.47.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
music-loader = "music_loader.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["music_loader*"]
