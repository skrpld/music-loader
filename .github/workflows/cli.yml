name: CLI

on:
  push:
    # Listing tags without branches would turn off branch builds.
    branches:
      - "**"
    # cli-v2.1.0 -> GitHub release "CLI 2.1.0" with the wheel and sdist.
    # Path filters are not applied to tag pushes.
    tags:
      - "cli-v*"
    paths:
      - "cli/**"
      - ".github/workflows/cli.yml"
  pull_request:
    paths:
      - "cli/**"
      - ".github/workflows/cli.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: cli

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and newest release.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: cli/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          cmp LICENSE ../LICENSE || { echo "::error::cli/LICENSE must be a copy of LICENSE"; exit 1; }

      - name: Test
        run: pytest -q

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Version
        id: version
        run: |
          version=$(python -c 'import music_loader; print(music_loader.__version__)')
          if [[ "$GITHUB_REF" == refs/tags/cli-v* ]]; then
            tag_version="${GITHUB_REF_NAME#cli-v}"
            if [ "$tag_version" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match music_loader.__version__ ($version). Bump cli/music_loader/__init__.py first."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build

      # The built wheel, not the checkout, must install and start.
      - name: Smoke test
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/venv/bin/music-loader" --version
          "$RUNNER_TEMP/venv/bin/music-loader" serve --help > /dev/null

      - name: Checksums
        working-directory: cli/dist
        run: sha256sum -- * > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: music-loader-cli-${{ steps.version.outputs.version }}
          path: cli/dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/cli-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      # Full history: release notes start at the previous cli-v* tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: music-loader-cli-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: bash .github/scripts/publish-release.sh "$TAG" "CLI $VERSION" "cli-v*" dist/*
