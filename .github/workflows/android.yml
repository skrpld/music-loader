name: Android

on:
  push:
    # Listing tags without branches would turn off branch builds.
    branches:
      - "**"
    # android-v1.2.0 -> GitHub release "Android 1.2.0" with the APK,
    # versionName 1.2.0. Path filters are not applied to tag pushes.
    tags:
      - "android-v*"
    # The app embeds the music_loader package from cli/.
    paths:
      - "android/**"
      - "cli/music_loader/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "cli/music_loader/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    outputs:
      apk: ${{ steps.apk.outputs.name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Chaquopy installs the app's Python packages and compiles them with the
      # same Python version the app embeds.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Caches Gradle and validates the wrapper jar.
      - uses: gradle/actions/setup-gradle@v4

      # A tag android-v1.2.0 (or android-v1.2.0-rc.1) becomes versionName
      # 1.2.0; otherwise appVersionName from gradle.properties is used.
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            version="${GITHUB_REF_NAME#android-v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not android-vMAJOR.MINOR.PATCH[-suffix]."
              exit 1
            fi
          else
            version=$(sed -n 's/^appVersionName=//p' gradle.properties)
          fi
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A signed release APK needs four repository secrets (see android/README.md);
      # without them (forks, first setup) the debug APK is built instead.
      - name: Prepare signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::warning::No signing secrets: the release gets a debug APK, which cannot be installed over another build."
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No signing secrets found, building the debug APK."
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      # The release build (R8, lint) is always compiled, so a broken release
      # build shows up even before signing is set up.
      - name: Build
        env:
          VARIANT: ${{ steps.signing.outputs.variant }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$VARIANT" = release ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug assembleRelease
          fi

      - name: Collect APK
        id: apk
        env:
          VARIANT: ${{ steps.signing.outputs.variant }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            name="music-loader-${VERSION_NAME}"
          else
            name="music-loader-${VERSION_NAME}-${GITHUB_RUN_NUMBER}"
          fi
          [ "$VARIANT" = release ] || name="${name}-debug"
          mkdir -p dist
          cp "app/build/outputs/apk/${VARIANT}/app-${VARIANT}.apk" "dist/${name}.apk"
          (cd dist && sha256sum -- "${name}.apk" > "${name}.apk.sha256")
          rm -f "$RUNNER_TEMP/release.keystore"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: android/dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Full history: release notes start at the previous android-v* tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # No artifact name: GitHub drops job outputs that contain a secret value
      # (the APK name includes "music-loader", which can match a secret such as
      # the key alias), so `needs.build.outputs.apk` can arrive empty. The run
      # has a single artifact; merge-multiple puts its files directly in dist/.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: bash .github/scripts/publish-release.sh "$TAG" "Android $VERSION" "android-v*" dist/*
