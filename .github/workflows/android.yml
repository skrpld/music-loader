name: Android APK

on:
  push:
    # Listing tags without branches would turn off branch builds.
    branches:
      - "**"
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  # Every published GitHub release gets the APK attached.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    outputs:
      apk: ${{ steps.apk.outputs.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle and validates the wrapper jar.
      - uses: gradle/actions/setup-gradle@v4

      # A signed release APK needs four repository secrets (see README); without them
      # (forks, first setup) the debug APK is built instead.
      - name: Prepare signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No signing secrets found, building the debug APK."
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      # A release "v1.2.0" or "android-v1.2.0" becomes versionName 1.2.0;
      # otherwise appVersionName from gradle.properties is used.
      - name: Version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            version="${RELEASE_TAG#android-}"
            version="${version#v}"
          else
            version=$(sed -n 's/^appVersionName=//p' gradle.properties)
          fi
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"

      # The release build (R8, lint) is always compiled, so a broken release
      # build shows up even before signing is set up.
      - name: Build
        env:
          VARIANT: ${{ steps.signing.outputs.variant }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$VARIANT" = release ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug assembleRelease
          fi

      - name: Collect APK
        id: apk
        env:
          VARIANT: ${{ steps.signing.outputs.variant }}
        run: |
          name="music-loader-${VERSION_NAME}-${GITHUB_RUN_NUMBER}-${VARIANT}"
          mkdir -p dist
          cp "app/build/outputs/apk/${VARIANT}/app-${VARIANT}.apk" "dist/${name}.apk"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: android/dist/*.apk
          if-no-files-found: error

  release:
    name: Attach to release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.apk }}
          path: dist

      - name: Upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.apk --clobber --repo "$GITHUB_REPOSITORY"
